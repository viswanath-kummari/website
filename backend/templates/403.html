{% extends 'base.html' %}

{% block title %}403 - Access Forbidden | Fresh Cut Meat Shop{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="fc-card p-5 mx-auto" style="max-width: 500px;">
    <div class="display-1 fw-bold text-danger mb-3">403</div>
    <h3 class="fw-bold text-charcoal mb-2">Access Restricted</h3>
    <p class="text-muted mb-4">You do not have authorization to access this administrative portal. Roles are verified by server credentials.</p>
    <a href="{{ url_for('auth.login_landing') }}" class="btn btn-charcoal">
      <i class="bi bi-shield-lock me-1"></i> Switch Portal
    </a>
  </div>
</div>
{% endblock %}
