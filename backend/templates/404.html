{% extends 'base.html' %}

{% block title %}404 - Page Not Found | Fresh Cut Meat Shop{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="fc-card p-5 mx-auto" style="max-width: 500px;">
    <div class="display-1 fw-bold text-orange mb-3">404</div>
    <h3 class="fw-bold text-charcoal mb-2">Page Not Found</h3>
    <p class="text-muted mb-4">The page or resource you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('customer.home') }}" class="btn btn-primary-fc">
      <i class="bi bi-house me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
