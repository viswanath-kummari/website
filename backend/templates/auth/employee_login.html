{% extends 'base.html' %}

{% block title %}Employee Login | Fresh Cut Management{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
      <div class="fc-card p-4 p-md-5 border-top border-4" style="border-top-color: var(--fc-muted-sage) !important;">
        <div class="text-center mb-4">
          <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3 text-white shadow-sm" style="width: 64px; height: 64px; background-color: var(--fc-muted-sage);">
            <i class="bi bi-person-badge-fill fs-2"></i>
          </div>
          <h2 class="fs-4 fw-bold text-charcoal mb-1">Employee Sign In</h2>
          <p class="text-muted small">Billing Counter & Shop Staff Terminal</p>
        </div>

        <form method="POST" action="{{ url_for('auth.employee_login') }}">
          <div class="mb-3">
            <label class="form-label small fw-bold text-charcoal">Assigned Staff Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" name="email" class="form-control border-start-0" placeholder="employee@freshcut.com" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-charcoal">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
              <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-sage py-2 fw-bold">
              Access Billing Counter <i class="bi bi-arrow-right ms-1"></i>
            </button>
          </div>

          <div class="text-center border-top pt-3">
            <small class="text-muted d-block mb-2">Switch portal:</small>
            <div class="d-flex justify-content-center gap-3 small">
              <a href="{{ url_for('auth.owner_login') }}" class="text-decoration-none text-charcoal fw-semibold">Owner Console</a>
              <span class="text-muted">•</span>
              <a href="{{ url_for('auth.customer_login') }}" class="text-decoration-none text-orange fw-semibold">Customer Store</a>
            </div>
          </div>
        </form>
      </div>

      <div class="text-center mt-3">
        <small class="text-muted"><i class="bi bi-info-circle me-1"></i> Employee accounts are created and managed by the Shop Owner.</small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
