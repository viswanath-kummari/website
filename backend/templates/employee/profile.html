{% extends 'employee/layout.html' %}

{% block title %}Employee Profile | Fresh Cut Meat Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="display-6 fw-bold heading-serif text-charcoal mb-4">Staff Counter Profile</h1>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="fc-card p-4 h-100">
          <h4 class="fs-5 fw-bold text-charcoal mb-3"><i class="bi bi-person me-2 text-sage"></i> Employee Information</h4>

          <form method="POST" action="{{ url_for('employee.profile') }}">
            <input type="hidden" name="action" value="update_info">

            <div class="mb-3">
              <label class="form-label small fw-bold text-charcoal">Full Name</label>
              <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold text-charcoal">Phone Number</label>
              <input type="tel" name="phone" class="form-control" value="{{ current_user.phone }}" required>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-charcoal">Assigned Email</label>
              <input type="email" class="form-control bg-light" value="{{ current_user.email }}" readonly>
            </div>

            <button type="submit" class="btn btn-sage w-100">
              Save Profile Updates
            </button>
          </form>
        </div>
      </div>

      <div class="col-md-6">
        <div class="fc-card p-4 h-100">
          <h4 class="fs-5 fw-bold text-charcoal mb-3"><i class="bi bi-shield-lock me-2 text-sage"></i> Security</h4>

          <form method="POST" action="{{ url_for('employee.profile') }}">
            <input type="hidden" name="action" value="change_password">

            <div class="mb-3">
              <label class="form-label small fw-bold text-charcoal">Current Password</label>
              <input type="password" name="old_password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-charcoal">New Password</label>
              <input type="password" name="new_password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-outline-fc w-100">
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
