{% extends 'base.html' %}

{% block title %}500 - Internal Server Error | Fresh Cut Meat Shop{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="fc-card p-5 mx-auto" style="max-width: 500px;">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h3 class="fw-bold text-charcoal mb-2">Internal Server Error</h3>
    <p class="text-muted mb-4">An unexpected system error occurred. All financial transactions remain safely protected by PostgreSQL rollback.</p>
    <a href="{{ url_for('customer.home') }}" class="btn btn-primary-fc">
      <i class="bi bi-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
