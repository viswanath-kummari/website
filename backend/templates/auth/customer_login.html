{% extends 'base.html' %}

{% block title %}Customer Login | Fresh Cut Meat Shop{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
      <div class="fc-card p-4 p-md-5 border-top border-4" style="border-top-color: var(--fc-burnt-orange) !important;">
        <div class="text-center mb-4">
          <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3 bg-orange text-white shadow-sm" style="width: 64px; height: 64px;">
            <i class="bi bi-person-fill fs-2"></i>
          </div>
          <h2 class="fs-4 fw-bold text-charcoal mb-1">Customer Sign In</h2>
          <p class="text-muted small">Access your cart, order history, and express pickup</p>
        </div>

        <form method="POST" action="{{ url_for('auth.customer_login') }}">
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

          <div class="mb-3">
            <label class="form-label small fw-bold text-charcoal">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" name="email" class="form-control border-start-0" placeholder="customer@freshcut.com" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-charcoal">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
              <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary-fc py-2 fw-bold">
              Sign In to Shop <i class="bi bi-arrow-right ms-1"></i>
            </button>
          </div>

          <div class="text-center border-top pt-3">
            <p class="small text-muted mb-2">New to Fresh Cut Meat Shop?</p>
            <a href="{{ url_for('auth.customer_register') }}" class="btn btn-outline-fc w-100 py-2 small fw-bold">
              Create New Customer Account
            </a>
          </div>
        </form>
      </div>

      <div class="text-center mt-3">
        <div class="d-flex justify-content-center gap-3 small">
          <a href="{{ url_for('auth.employee_login') }}" class="text-decoration-none text-muted">Employee Login</a>
          <span class="text-muted">•</span>
          <a href="{{ url_for('auth.owner_login') }}" class="text-decoration-none text-muted">Owner Portal</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
